<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코인선물 계산기 & 매매일지</title>
    <!-- 카카오 SDK -->
    <script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --bg-color: #121318;
            --card-bg: #1e2026;
            --input-bg: #2b2f36;
            --text-color: #eaeaea;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --border-color: #363a45;
            --kakao-yellow: #FEE500;
            --accent-yellow: #f0b90b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-menu {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--card-bg);
            color: #848e9c;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background-color: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        h2 {
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent-yellow);
            margin-bottom: 16px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid var(--border-color);
        }
        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #848e9c;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #b7bdc6;
        }
        input, select {
            width: 100%;
            padding: 9px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            box-sizing: border-box;
        }
        .row {
            display: flex;
            gap: 8px;
        }
        .row > div {
            flex: 1;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2b2f36;
            font-size: 0.85rem;
        }
        .result-row:last-child {
            border-bottom: none;
        }
        .val-green { color: var(--accent-green); font-weight: bold; }
        .val-red { color: var(--accent-red); font-weight: bold; }
        .val-highlight { color: var(--accent-yellow); font-weight: bold; }
        
        .btn-kakao {
            width: 100%;
            padding: 14px;
            background-color: var(--kakao-yellow);
            color: #000000;
            font-weight: bold;
            font-size: 0.95rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* 매매일지 모바일 전용 스타일 최적화 */
        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            text-align: center;
            min-width: 530px;
        }
        th, td {
            padding: 6px 3px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        th {
            background-color: var(--input-bg);
            color: #848e9c;
        }
        td input[type="text"] {
            width: 80px;
            padding: 5px;
            font-size: 0.8rem;
            text-align: center;
        }
        td input[type="date"] {
            width: 110px;
            padding: 5px;
            font-size: 0.75rem;
            text-align: center;
        }
        .btn-save {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('calc')">🪙 계산기</button>
        <button class="tab-btn" onclick="switchTab('journal')">📅 매매일지 (수익률표)</button>
    </div>

    <!-- 1. 계산기 탭 -->
    <div id="tab-calc" class="tab-content active">
        <h2>🪙 코인선물 손익 & 청산가 계산기</h2>

        <div class="card">
            <div class="card-title">1. 통화 및 자산 설정</div>
            <div class="row">
                <div class="form-group">
                    <label>통화 선택</label>
                    <select id="currency" onchange="calculate()">
                        <option value="USDT">USDT ($)</option>
                        <option value="KRW">KRW (원)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>적용 환율 (KRW/USD)</label>
                    <input type="number" id="rate" value="1420" oninput="calculate()">
                </div>
            </div>
            <div class="form-group">
                <label>총자산 ($)</label>
                <input type="number" id="totalAsset" value="31.36" oninput="calculate()">
            </div>
        </div>

        <div class="card">
            <div class="card-title">2. 매매 변수 입력</div>
            <div class="form-group">
                <label>포지션 방향</label>
                <select id="position" onchange="calculate()">
                    <option value="Short">숏 (Short)</option>
                    <option value="Long">롱 (Long)</option>
                </select>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>투입 증거금</label>
                    <input type="number" id="margin" value="10" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label>레버리지 (배)</label>
                    <input type="number" id="leverage" value="5" oninput="calculate()">
                </div>
            </div>
            <div class="form-group">
                <label>진입 예상가</label>
                <input type="number" id="entry" value="0.3171" step="any" oninput="calculate()">
            </div>
            <div class="row">
                <div class="form-group">
                    <label>손절가 (Stop-Loss)</label>
                    <input type="number" id="stopLoss" value="0.319" step="any" oninput="calculate()">
                </div>
                <div class="form-group">
                    <label>목표가 (Take-Profit)</label>
                    <input type="number" id="takeProfit" value="0.3058" step="any" oninput="calculate()">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">3. 계산 결과</div>
            <div class="result-row"><span>포지션 총 규모</span><span id="posValue">-</span></div>
            <div class="result-row"><span>증거금 비중</span><span id="marginRatio">-</span></div>
            <div class="result-row"><span>손절 폭 / 익절 폭</span><span id="slTpPct">-</span></div>
            <div class="result-row"><span>손익비 (Risk : Reward)</span><span id="rrRatio" class="val-highlight">-</span></div>
            <div class="result-row"><span>손절 시 손실금액</span><span id="slAmount" class="val-red">-</span></div>
            <div class="result-row"><span>손실률 (리스크)</span><span id="slRoe" class="val-red">-</span></div>
            <div class="result-row"><span>예상 수익금액</span><span id="tpAmount" class="val-green">-</span></div>
            <div class="result-row"><span>수익률 (ROE)</span><span id="tpRoe" class="val-green">-</span></div>
            <div class="result-row"><span>예상 청산 가격 (Liq. Price)</span><span id="liqPrice" class="val-red">-</span></div>
            <div class="result-row"><span>청산까지 거리</span><span id="liqDist">-</span></div>
        </div>

        <button class="btn-kakao" onclick="sendToKakao()">💬 내 카카오톡으로 결과 전송</button>
    </div>

    <!-- 2. 매매일지 탭 -->
    <div id="tab-journal" class="tab-content">
        <h2>📅 복리 수익률 매매일지 (클라우드 연동)</h2>
        <div class="card">
            <div class="row">
                <div class="form-group">
                    <label>시작 원금 ($)</label>
                    <input type="number" id="startCapital" value="24.91" oninput="renderJournal()">
                </div>
                <div class="form-group">
                    <label>일일 목표 수익률 (%)</label>
                    <input type="number" id="targetRate" value="3" step="0.1" oninput="renderJournal()">
                </div>
            </div>
            <div class="form-group">
                <label>시작일</label>
                <input type="date" id="startDate" value="2026-08-20" onchange="renderJournal()">
            </div>
        </div>

        <div class="card">
            <div class="card-title">일차별 수익 내역 (30일 목표)</div>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 50px;">차수</th>
                            <th style="width: 65px;">원금($)</th>
                            <th style="width: 75px;">누적수익($)</th>
                            <th style="width: 65px;">수익금($)</th>
                            <th style="width: 85px;">예상날짜</th>
                            <th style="width: 90px;">결과</th>
                            <th style="width: 120px;">실행날짜</th>
                        </tr>
                    </thead>
                    <tbody id="journalBody">
                    </tbody>
                </table>
            </div>
            <button class="btn-save" onclick="saveJournalData()">☁️ 구글 클라우드에 저장하기</button>
        </div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCdC7s_flFySmLciXR9jtSl6Q63vaQ3hvs",
    authDomain: "coin-calc-5579f.firebaseapp.com",
    databaseURL: "https://coin-calc-5579f-default-rtdb.firebaseio.com",
    projectId: "coin-calc-5579f",
    storageBucket: "coin-calc-5579f.firebasestorage.app",
    messagingSenderId: "860231356821",
    appId: "1:860231356821:web:c34a3a76427d7e4c95a69c",
    measurementId: "G-69VTYBGF7H"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let calcResultData = {};
let cloudJournalData = {};
const KAKAO_JS_KEY = 'd2208aa43219860b96d70ef73ae6d4b3'; 

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabName === 'calc') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-calc').classList.add('active');
    } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-journal').classList.add('active');
    }
}

async function fetchExchangeRate() {
    try {
        const response = await fetch('https://api.upbit.com/v1/ticker?markets=KRW-USDT');
        const data = await response.json();
        if (data && data[0] && data[0].trade_price) {
            document.getElementById('rate').value = data[0].trade_price.toFixed(2);
            calculate();
        }
    } catch (error) {
        console.log('환율 로드 실패:', error);
    }
}

function calculate() {
    const currency = document.getElementById('currency').value;
    const rate = parseFloat(document.getElementById('rate').value) || 0;
    const totalAsset = parseFloat(document.getElementById('totalAsset').value) || 0;
    const position = document.getElementById('position').value;
    const margin = parseFloat(document.getElementById('margin').value) || 0;
    const leverage = parseFloat(document.getElementById('leverage').value) || 0;
    const entry = parseFloat(document.getElementById('entry').value) || 0;
    const stopLoss = parseFloat(document.getElementById('stopLoss').value) || 0;
    const takeProfit = parseFloat(document.getElementById('takeProfit').value) || 0;

    const symbol = currency === 'KRW' ? '원' : '$';
    const posValue = margin * leverage;
    const marginRatio = totalAsset > 0 ? (margin / totalAsset * 100).toFixed(2) + '%' : '-';
    
    const slPct = entry > 0 ? Math.abs(entry - stopLoss) / entry : 0;
    const tpPct = entry > 0 ? Math.abs(takeProfit - entry) / entry : 0;
    const rrRatio = slPct > 0 ? (tpPct / slPct).toFixed(2) : '0';

    const slAmount = posValue * slPct;
    const slAmountKrw = currency === 'KRW' ? slAmount : slAmount * rate;
    const slRoe = margin > 0 ? (slAmount / margin * 100).toFixed(2) : 0;

    const tpAmount = posValue * tpPct;
    const tpAmountKrw = currency === 'KRW' ? tpAmount : tpAmount * rate;
    const tpRoe = margin > 0 ? (tpAmount / margin * 100).toFixed(2) : 0;

    let liqPrice = 0;
    if (leverage > 0 && entry > 0) {
        liqPrice = position === 'Long' ? entry * (1 - 1/leverage + 0.005) : entry * (1 + 1/leverage - 0.005);
    }
    const liqDist = entry > 0 ? (Math.abs(liqPrice - entry) / entry * 100).toFixed(2) : 0;

    document.getElementById('posValue').innerText = `${posValue.toLocaleString()} ${symbol}`;
    document.getElementById('marginRatio').innerText = marginRatio;
    document.getElementById('slTpPct').innerText = `${(slPct*100).toFixed(2)}% / ${(tpPct*100).toFixed(2)}%`;
    document.getElementById('rrRatio').innerText = `1 : ${rrRatio}`;
    document.getElementById('slAmount').innerText = `-${slAmount.toLocaleString(undefined, {maximumFractionDigits: 2})} ${symbol} (약 -${Math.round(slAmountKrw).toLocaleString()}원)`;
    document.getElementById('slRoe').innerText = `-${slRoe}%`;
    document.getElementById('tpAmount').innerText = `+${tpAmount.toLocaleString(undefined, {maximumFractionDigits: 2})} ${symbol} (약 +${Math.round(tpAmountKrw).toLocaleString()}원)`;
    document.getElementById('tpRoe').innerText = `+${tpRoe}%`;
    document.getElementById('liqPrice').innerText = liqPrice.toFixed(4);
    document.getElementById('liqDist').innerText = `${liqDist}%`;

    calcResultData = {
        position: position,
        margin: `${margin}${symbol}`,
        leverage: `${leverage}배`,
        entry: entry,
        stopLoss: stopLoss,
        takeProfit: takeProfit,
        rrRatio: `1 : ${rrRatio}`,
        slAmount: `-${slAmount.toFixed(2)}${symbol} (-${slRoe}%)`,
        tpAmount: `+${tpAmount.toFixed(2)}${symbol} (+${tpRoe}%)`,
        liqPrice: liqPrice.toFixed(4)
    };
}

function loadAndRenderJournal() {
    db.ref('journal_data').on('value', (snapshot) => {
        cloudJournalData = snapshot.val() || {};
        renderJournal();
    });
}

function renderJournal() {
    const startCapital = parseFloat(document.getElementById('startCapital').value) || 24.91;
    const targetRate = (parseFloat(document.getElementById('targetRate').value) || 3) / 100;
    const startDateVal = document.getElementById('startDate').value;
    const startDate = startDateVal ? new Date(startDateVal) : new Date();

    let html = '';
    let currentCapital = startCapital;

    for (let day = 1; day <= 30; day++) {
        let nextCapital = currentCapital * (1 + targetRate);
        let profitDollar = nextCapital - currentCapital;

        let expDate = new Date(startDate);
        expDate.setDate(startDate.getDate() + (day - 1));
        let dateStr = expDate.toISOString().split('T')[0];

        let savedResult = cloudJournalData[day]?.result || (day === 1 ? '1일차' : '');
        let savedExecDate = cloudJournalData[day]?.execDate || (day === 1 ? dateStr : '');

        html += `
            <tr>
                <td><b>${day}일차</b></td>
                <td>${currentCapital.toFixed(2)}</td>
                <td>${nextCapital.toFixed(2)}</td>
                <td class="val-green">+${profitDollar.toFixed(2)}</td>
                <td>${dateStr}</td>
                <td><input type="text" id="res_${day}" value="${savedResult}" placeholder="결과"></td>
                <td><input type="date" id="date_${day}" value="${savedExecDate}"></td>
            </tr>
        `;
        currentCapital = nextCapital;
    }
    document.getElementById('journalBody').innerHTML = html;
}

function saveJournalData() {
    const journalData = {};
    for (let day = 1; day <= 30; day++) {
        const resultVal = document.getElementById(`res_${day}`).value;
        const execDateVal = document.getElementById(`date_${day}`).value;
        journalData[day] = { result: resultVal, execDate: execDateVal };
    }
    
    db.ref('journal_data').set(journalData, (error) => {
        if (error) {
            alert('클라우드 저장 실패: ' + error.message);
        } else {
            alert('☁️ 구글 클라우드 저장 완료! 휴대폰/PC 모두 연동됩니다.');
        }
    });
}

function initKakao() {
    if (typeof Kakao !== 'undefined' && !Kakao.isInitialized()) {
        try { Kakao.init(KAKAO_JS_KEY); } catch (e) {}
    }
}

function sendToKakao() {
    if (typeof Kakao === 'undefined') {
        alert('카카오 SDK 스크립트가 로드되지 않았습니다.');
        return;
    }
    if (!Kakao.isInitialized()) {
        Kakao.init(KAKAO_JS_KEY);
    }
    Kakao.Auth.login({
        scope: 'talk_message',
        success: function() { executeSend(); },
        fail: function(err) { alert('카카오 로그인 실패: ' + JSON.stringify(err)); }
    });
}

function executeSend() {
    const textMsg = `📊 [선물 매매 일지 기록]\n\n` +
        `• 포지션: ${calcResultData.position} (${calcResultData.leverage})\n` +
        `• 투입증거금: ${calcResultData.margin}\n` +
        `• 진입가: ${calcResultData.entry}\n` +
        `• 손절가: ${calcResultData.stopLoss}\n` +
        `• 목표가: ${calcResultData.takeProfit}\n` +
        `--------------------\n` +
        `• 손익비: ${calcResultData.rrRatio}\n` +
        `• 손절시: ${calcResultData.slAmount}\n` +
        `• 익절시: ${calcResultData.tpAmount}\n` +
        `• 예상 청산가: ${calcResultData.liqPrice}`;

    Kakao.API.request({
        url: '/v2/api/talk/memo/default/send',
        data: {
            template_object: {
                object_type: 'text',
                text: textMsg,
                link: {
                    web_url: window.location.href,
                    mobile_web_url: window.location.href,
                },
            },
        },
        success: function() { alert('카카오톡 나와의 채팅방으로 결과가 전송되었습니다!'); },
        fail: function(error) { alert('전송 실패: ' + JSON.stringify(error)); },
    });
}

window.onload = function() {
    calculate();
    initKakao();
    fetchExchangeRate();
    loadAndRenderJournal();
};
</script>
</body>
</html>
